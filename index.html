<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Plated India — contemporary dining, thoughtful plates and warm hospitality.">
<title>Plated India — Contemporary Dining</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useMemo, useState } = React;

const dishes = [
  { name: 'Korean Gochujang Glazed Chicken', price: '₹895', desc: 'Gochujang glaze, roasted vegetables, herbs and a rich savoury jus.', 
  { name: 'Creamy Chicken Alfredo', price: '₹795', desc: 'Silky parmesan cream, grilled chicken, herbs and fresh pasta.', image: './dish-2.png', tag: 'FAVOURITE' },
  { name: 'Golden Chicken Bowl', price: '₹725', desc: 'Spiced chicken, fragrant rice, greens and fresh guacamole.', image: './dish-3.png', tag: 'POPULAR' },
  { name: 'Plated Pasta', price: '₹745', desc: 'Comforting pasta, roasted chicken and a delicate herb finish.', image: '.https://ibb.co/Pzts4YfR
  { name: 'Matcha Basque Cheesecake', price: '₹495', desc: 'Roasted hazelnut, cacao and vanilla ice cream.', image: './dish-4.png', tag: 'DESSERT' },
  { name: 'Yuzu Panna Cotta', price: '₹475', desc: 'Apple, brown butter, crème fraîche and caramel.', image: './dish-3.png', tag: 'DESSERT' },
];

const categories = ['All', 'Signatures', 'Mains', 'Bowls', 'Vegetarian', 'Desserts'];
const prizes = ['10% OFF', 'FREE DESSERT', 'FREE DRINK', '15% OFF', 'COMPLIMENTARY SIDE', 'TRY AGAIN'];

function usePath() {
  const getPath = () => { const h = window.location.hash.replace(/^#/, ''); return h || '/'; };
  const [path, setPath] = useState(getPath());
  useEffect(() => {
    const onPop = () => setPath(getPath());
    window.addEventListener('popstate', onPop);
    window.addEventListener('hashchange', onPop);
    return () => window.removeEventListener('popstate', onPop);
      window.removeEventListener('hashchange', onPop);
  }, []);
  return path;
}

function navigate(path) {
  window.location.hash = path;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function App() {
  const path = usePath();
  const [menuOpen, setMenuOpen] = useState(false);
  const [circleOpen, setCircleOpen] = useState(false);
  const [toast, setToast] = useState('');

  useEffect(() => {
    const reveal = () => document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight * .9) el.classList.add('visible');
    });
    reveal();
    window.addEventListener('scroll', reveal, { passive: true });
    return () => window.removeEventListener('scroll', reveal);
  }, [path]);

  const link = (p) => { setMenuOpen(false); navigate(p); };

  return <div className="site">
    <style>{styles}</style>
    <Header path={path} menuOpen={menuOpen} setMenuOpen={setMenuOpen} link={link} onCircle={() => setCircleOpen(true)} />
    {path === '/' && <Home link={link} onCircle={() => setCircleOpen(true)} setToast={setToast} />}
    {path === '/menu' && <MenuPage link={link} />}
    {path === '/story' && <StoryPage link={link} />}
    {path === '/circle' && <CirclePage onCircle={() => setCircleOpen(true)} setToast={setToast} />}
    {path === '/spin' && <SpinPage setToast={setToast} />}
    {path === '/contact' && <ContactPage />}
    <Footer link={link} />
    {circleOpen && <CircleModal close={() => setCircleOpen(false)} setToast={setToast} />}
    {toast && <div className="toast" onClick={() => setToast('')}>{toast}</div>}
  </div>;
}

function Header({ path, menuOpen, setMenuOpen, link, onCircle }) {
  return <header className="nav-wrap">
    <nav className="nav">
      <button className="brand" onClick={() => link('/')} aria-label="Plated India home"><span>PLATED</span><small>INDIA</small></button>
      <div className={`nav-links ${menuOpen ? 'open' : ''}`}>
        {[['/', 'Home'], ['/menu', 'Menu'], ['/story', 'Our Story'], ['/circle', 'Loyalty Circle'], ['/contact', 'Contact']].map(([p, label]) =>
          <button key={p} className={path === p ? 'active' : ''} onClick={() => link(p)}>{label}</button>)}
        <button className="mobile-circle" onClick={onCircle}>Join the Circle</button>
      </div>
      <div className="nav-actions">
        <button className="text-link" onClick={onCircle}>Join Circle</button>
        <button className="reserve-btn" onClick={() => link('/contact')}>Reserve a Table</button>
      </div>
      <button className="hamb" onClick={() => setMenuOpen(!menuOpen)} aria-label="Open menu"><i></i><i></i></button>
    </nav>
  </header>;
}

function Home({ link, onCircle, setToast }) {
  return <main>
    <section className="hero">
      <div className="hero-image" style={{backgroundImage:"url('./images/dish-1.png')"}}></div>
      <div className="hero-shade"></div>
      <div className="hero-copy reveal visible">
        <p className="eyebrow light">CONTEMPORARY DINING · NEW DELHI</p>
        <h1>One plate.<br/><em>Whole world.</em></h1>
        <p>Comfort food reimagined with refined ingredients, thoughtful technique and the warmth of a table worth staying at.</p>
        <div className="hero-buttons"><button className="btn light-btn" onClick={() => link('/menu')}>Explore the Menu <span>↗</span></button><button className="ghost-light" onClick={() => link('/contact')}>Book a Table</button></div>
      </div>
      <div className="hero-note">SINCE 2026 <span></span> PLATED INDIA</div>
      <div className="scroll-cue">SCROLL <span>↓</span></div>
    </section>

    <section className="intro section reveal">
      <div className="intro-image"><img src="./images/dish-3.png" alt="Plated chicken bowl"/></div>
      <div className="intro-copy"><p className="eyebrow">ABOUT PLATED</p><h2>More than<br/><em>a meal.</em></h2><p>Plated is a modern restaurant built around one simple idea: take the foods people already love and give them a little more imagination.</p><p>From Indian-inspired comfort to flavours from around the world, every dish arrives complete, considered and ready to be remembered.</p><button className="arrow-link" onClick={() => link('/story')}>Discover our story <span>↗</span></button></div>
    </section>

    <section className="signature section sage reveal">
      <div className="section-head"><div><p className="eyebrow">SIGNATURE MENU</p><h2>A curated expression<br/><em>of the season.</em></h2></div><button className="arrow-link dark" onClick={() => link('/menu')}>Explore all menu <span>↗</span></button></div>
      <div className="dish-grid">{dishes.slice(0,3).map(d => <DishCard key={d.name} dish={d} />)}</div>
    </section>

    <section className="experience section reveal">
      <div className="experience-left"><p className="eyebrow">THE EXPERIENCE</p><h2>Come hungry.<br/><em>Leave inspired.</em></h2><p>Warm service, bold flavours and a room designed for long lunches, spontaneous dinners and the people you want around your table.</p></div>
      <div className="experience-points"><Point n="01" title="Fresh ingredients" text="Thoughtful produce, prepared with care."/><Point n="02" title="Bold flavours" text="Familiar comfort with an unexpected turn."/><Point n="03" title="A modern table" text="An easygoing setting with fine-dining attention."/></div>
    </section>

    <section className="story-banner reveal"><div className="story-bg"></div><div className="story-overlay"></div><div className="story-content"><p className="eyebrow light">OUR PHILOSOPHY</p><h2>Rooted in tradition.<br/><em>Created for today.</em></h2><button className="btn light-btn" onClick={() => link('/story')}>Our Story <span>↗</span></button></div></section>

    <section className="circle-teaser section reveal">
      <div className="circle-art"><div className="circle-ring">PLATED · CIRCLE · PLATED · CIRCLE · </div><div className="circle-center">PC</div></div>
      <div><p className="eyebrow">LOYALTY PROGRAM · LIFETIME ACCESS</p><h2>Welcome to<br/><em>the Plated Circle.</em></h2><p>Good food deserves good company. Join our circle for exclusive rewards, surprises and special moments created just for our regulars.</p><div className="two-btn"><button className="btn dark-btn" onClick={onCircle}>Join the Circle</button><button className="arrow-link" onClick={() => link('/spin')}>Try your luck <span>↗</span></button></div></div>
    </section>

    <section className="spin-strip reveal"><div><p className="eyebrow light">A LITTLE SOMETHING EXTRA</p><h2>Feeling <em>lucky?</em></h2><p>Spin the Plated Wheel and reveal a little reward for your next visit.</p></div><button className="wheel-cta" onClick={() => link('/spin')}>SPIN THE WHEEL <span>↗</span></button></section>

    <Reviews />
    <section className="final-cta reveal"><p className="eyebrow">PLATED INDIA</p><h2>Your table<br/><em>is waiting.</em></h2><button className="btn dark-btn" onClick={() => link('/contact')}>Reserve a Table <span>↗</span></button></section>
  </main>;
}

function Point({n,title,text}) { return <div className="point"><span>{n}</span><div><h3>{title}</h3><p>{text}</p></div></div> }
function DishCard({dish}) { return <article className="dish"><div className="dish-image"><img src={dish.image} alt={dish.name}/><span>{dish.tag}</span></div><div className="dish-meta"><div><h3>{dish.name}</h3><p>{dish.desc}</p></div><strong>{dish.price}</strong></div></article> }
function Reviews(){ return <section className="reviews section reveal"><div className="section-head"><div><p className="eyebrow">AT THE TABLE</p><h2>Good food.<br/><em>Good company.</em></h2></div><div className="review-mark">★★★★★</div></div><div className="review-grid">{[['“The flavours were incredible and the entire experience felt so thoughtfully designed.”','Aanya M.'],['“Beautiful food, warm service and a completely different take on comfort dining.”','Rohan K.'],['“One of those restaurants you immediately want to come back to.”','Meera S.']].map(([q,n])=><blockquote key={n}><span>“</span><p>{q}</p><footer>★★★★★ <small>{n}</small></footer></blockquote>)}</div></section> }

function MenuPage(){ const [cat,setCat]=useState('All'); const filtered=useMemo(()=>dishes.filter(d=>cat==='All'||(cat==='Signatures'&&d.tag==='SIGNATURE')||(cat==='Desserts'&&d.tag==='DESSERT')||['Mains','Bowls','Vegetarian'].includes(cat)),[cat]); return <main className="inner-page"><PageHero eyebrow="THE MENU" title={<>A table full of<br/><em>good ideas.</em></>} text="A collection of complete, considered dishes inspired by comfort food from India and around the world."/><section className="menu-section section"><div className="category-bar">{categories.map(c=><button key={c} className={cat===c?'selected':''} onClick={()=>setCat(c)}>{c}</button>)}</div><div className="menu-list">{filtered.map((d,i)=><DishCard key={d.name+i} dish={d}/>)}</div></section></main> }

function StoryPage(){ return <main className="inner-page"><PageHero eyebrow="OUR STORY" title={<>India, through<br/><em>a modern lens.</em></>} text="A restaurant shaped by curiosity, comfort and the belief that a great meal should feel both familiar and new."/><section className="story-editorial section"><div className="story-copy"><p className="eyebrow">OUR INSPIRATION</p><h2>Familiar flavours.<br/><em>Fresh perspective.</em></h2><p>Plated India is imagined as a meeting point between the food we grew up loving and the dishes we are excited to discover next.</p><p>We keep the soul of comfort food intact while giving every plate a little more room to breathe: cleaner presentation, considered ingredients and flavours that invite another bite.</p></div><img src="./images/dish-4.png" alt="Plated pasta dish"/></section><section className="quote-section sage"><p>“Food is not just what we serve.<br/><em>It is how we bring people together.</em>”</p></section><section className="values section"><div><p className="eyebrow">THE PLATED WAY</p><h2>Three things<br/><em>we care about.</em></h2></div><div className="value-list"><Point n="01" title="Ingredient first" text="Good ingredients do most of the talking."/><Point n="02" title="Thoughtful technique" text="Classic ideas, modern execution."/><Point n="03" title="Generous hospitality" text="Come as a guest. Leave like a regular."/></div></section></main> }

function PageHero({eyebrow,title,text}){ return <section className="page-hero"><div><p className="eyebrow">{eyebrow}</p><h1>{title}</h1><p className="hero-lede">{text}</p></div></section> }

function CirclePage({onCircle}){ return <main className="inner-page"><PageHero eyebrow="LOYALTY PROGRAM · LIFETIME ACCESS" title={<>Good food.<br/><em>Better rewards.</em></>} text="Welcome to the Plated Circle — our little way of saying thank you for coming back."/><section className="circle-page section"><div className="membership-card"><div className="card-top"><span>PLATED INDIA</span><span>PC · 001</span></div><div className="big-pc">PC</div><div className="card-bottom"><span>PLATED CIRCLE MEMBER</span><span>2026</span></div></div><div className="circle-info"><p className="eyebrow">YOUR PERKS</p><h2>Made for<br/><em>our regulars.</em></h2>{['Earn points with every visit','Birthday surprises','Members-only offers','Early access to special menus','Invitations to exclusive events','Complimentary treats'].map((x,i)=><div className="perk" key={x}><b>0{i+1}</b><span>{x}</span></div>)}<button className="btn dark-btn" onClick={onCircle}>Join the Circle <span>↗</span></button></div></section></main> }

function SpinPage({setToast}){ const [rotation,setRotation]=useState(0); const [spinning,setSpinning]=useState(false); const [result,setResult]=useState(''); const spin=()=>{ if(spinning)return; const index=Math.floor(Math.random()*prizes.length); const extra=360*5+index*(360/prizes.length); setSpinning(true); setResult(''); setRotation(r=>r+extra); setTimeout(()=>{setResult(prizes[index]);setSpinning(false);setToast('Your reward: '+prizes[index]);},4200); }; return <main className="spin-page"><section className="spin-intro"><p className="eyebrow light">THE PLATED CIRCLE</p><h1>Spin for a little<br/><em>something extra.</em></h1><p>Because sometimes dinner comes with a surprise.</p></section><section className="wheel-area"><div className="pointer">▼</div><div className="wheel" style={{transform:`rotate(${rotation}deg)`}}>{prizes.map((p,i)=><div className="wheel-label" key={p} style={{transform:`rotate(${i*60}deg) translateY(-128px) rotate(${-i*60}deg)`}}>{p}</div>)}</div><button className="spin-button" onClick={spin} disabled={spinning}>{spinning?'SPINNING…':'SPIN'}</button>{result&&<div className="win-card"><small>YOU WON</small><strong>{result}</strong><p>Show this reward when you visit Plated.</p></div>}</section></main> }

function ContactPage(){ const [sent,setSent]=useState(false); return <main className="inner-page"><PageHero eyebrow="COME FIND US" title={<>Your table<br/><em>is waiting.</em></>} text="For reservations, celebrations or simply a good dinner, we would love to have you at our table."/><section className="contact-grid section"><div className="contact-info"><div><p className="eyebrow">ADDRESS</p><h3>Panchsheel Park Market,<br/>near Hauz Khas, New Delhi</h3></div><div><p className="eyebrow">OPENING HOURS</p><h3>Tue–Sun, 12:30 PM – 11:00 PM<br/><small>Closed Mondays</small></h3></div><div><p className="eyebrow">CONTACT</p><h3>+91 9812345678<br/>hello@platedindia.com</h3></div></div><form className="reservation" onSubmit={e=>{e.preventDefault();setSent(true)}}><p className="eyebrow">RESERVE A TABLE</p><h2>Let's make<br/><em>it a date.</em></h2><div className="form-grid"><label>Name<input required placeholder="Your name"/></label><label>Email<input required type="email" placeholder="you@email.com"/></label><label>Phone<input placeholder="+91"/></label><label>Guests<select defaultValue="2"><option>2 guests</option><option>3 guests</option><option>4 guests</option><option>5+ guests</option></select></label><label>Date<input type="date"/></label><label>Time<input type="time"/></label></div><label>Special request<textarea rows="4" placeholder="Birthday, dietary note, occasion…"/></label><button className="btn dark-btn" type="submit">{sent?'Request received ✓':'Request a Reservation ↗'}</button></form></section><section className="map-placeholder"><div><p className="eyebrow">FIND US</p><h2>Come by.<br/><em>Stay awhile.</em></h2><span>Map integration can be added here.</span></div></section></main> }

function CircleModal({close}){ const [done,setDone]=useState(false); return <div className="modal-backdrop" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}><button className="modal-x" onClick={close}>×</button>{done?<><p className="eyebrow">WELCOME TO THE CIRCLE</p><h2>You’re in.<br/><em>See you at the table.</em></h2><p>We’ve saved your details for the next step.</p><button className="btn dark-btn" onClick={close}>Done</button></>:<><p className="eyebrow">PLATED CIRCLE</p><h2>Join the<br/><em>inner circle.</em></h2><p>Sign up for member rewards, birthday surprises and special invitations.</p><form onSubmit={e=>{e.preventDefault();setDone(true)}}><input required placeholder="First name"/><input required type="email" placeholder="Email address"/><button className="btn dark-btn">Join the Circle ↗</button></form></>}</div></div> }

function Footer({link}){ return <footer className="footer"><div className="footer-top"><div><button className="brand footer-brand" onClick={()=>link('/')}><span>PLATED</span><small>INDIA</small></button><p>Modern Indian dining.<br/>One plate. Whole world.</p></div><div><p className="eyebrow">NAVIGATION</p><button onClick={()=>link('/menu')}>Menu</button><button onClick={()=>link('/story')}>Our Story</button><button onClick={()=>link('/circle')}>Loyalty Circle</button><button onClick={()=>link('/contact')}>Contact</button></div><div><p className="eyebrow">VISIT</p><p>Panchsheel Park Market<br/>New Delhi, India</p><p>Tue–Sun · 12:30 PM – 11 PM</p></div><div><p className="eyebrow">CONTACT</p><p>+91 9812345678<br/>hello@platedindia.com</p></div></div><div className="footer-bottom"><span>© 2026 PLATED INDIA</span><span>ALL RIGHTS RESERVED</span></div></footer> }

const styles = `
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');
